<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MilyonerFen: 6. Sınıf Fen Bilimleri</title>
<style>
:root{--ink:#eef2ff;--muted:#a9b4d6;--gold:#fbbf24;--blue:#1e3a8a;--deep:#0a1030;--panel:#101a4a;--line:#3b4f9e;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1050px;margin:auto;padding:12px}
.game{background:radial-gradient(120% 90% at 50% 0%,#1d2d7a 0%,var(--deep) 60%);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}
@media(max-width:820px){.game{grid-template-columns:1fr}.ladder{order:-1;display:flex;flex-wrap:wrap;gap:4px}.ladder li{flex:1 1 60px}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.chip{background:#0b1450;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.chip b{color:var(--gold)}
.timer{height:14px;background:#0b1450;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#fbbf24);transition:width .25s linear}
.timer.low i{background:#ef4444}
.q{background:linear-gradient(180deg,#14236b,#0b1450);border:2px solid var(--line);border-radius:14px;padding:16px 18px;font-size:20px;font-weight:700;min-height:92px;display:flex;align-items:center;justify-content:center;text-align:center}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:8px 2px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.q{font-size:18px}}
.opt{position:relative;text-align:left;border:2px solid var(--line);background:linear-gradient(180deg,#14236b,#0b1450);color:var(--ink);border-radius:999px;padding:11px 18px;font:700 16px system-ui,sans-serif;cursor:pointer;min-height:52px;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .l{color:var(--gold);font-weight:900}
.opt.sel{background:linear-gradient(180deg,#b45309,#78350f);border-color:var(--gold)}
.opt.ok{background:linear-gradient(180deg,#16a34a,#14532d);border-color:#86efac;animation:blink .5s 3}
.opt.bad{background:linear-gradient(180deg,#dc2626,#7f1d1d);border-color:#fca5a5}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.opt .poll{position:absolute;left:18px;right:18px;bottom:3px;height:4px;border-radius:4px;background:#ffffff22;overflow:hidden}
.opt .poll i{display:block;height:100%;background:var(--gold)}
.opt .pc{margin-left:auto;font-size:13px;color:var(--gold)}
@keyframes blink{50%{filter:brightness(1.6)}}
.btn{border:2px solid var(--line);background:#0b1450;color:var(--ink);border-radius:12px;padding:9px 14px;font:700 15px system-ui,sans-serif;cursor:pointer;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#1f1300;border-color:var(--gold)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
.jok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.msg{margin-top:12px;background:#0b1450;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
.msg b{color:var(--gold)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:3px}
.ladder li{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:14px;color:var(--muted)}
.ladder li.safe{color:#fff}
.ladder li.cur{background:var(--gold);color:#1f1300}
.ladder li.done{color:#86efac}
.center{text-align:center;padding:24px 8px}
.big{font-size:42px;font-weight:900;color:var(--gold);margin:8px 0}
.note{font-size:13px;color:var(--muted);margin:12px 4px 0}
@media (prefers-reduced-motion:reduce){.opt.ok{animation:none}.timer i{transition:none}}
</style></head><body>
<main class="app">
<div class="game">
 <section aria-live="polite" id="main"></section>
 <aside aria-label="Ödül merdiveni"><ol class="ladder" id="ladder"></ol></aside>
</div>
<p class="note">Sorular 6. sınıf Fen Bilimleri 1. ünite (Güneş Sistemi ve Tutulmalar) ve 2. ünite (Kuvvetin Etkisinde Hareket) kazanımlarından hazırlanmıştır. Ödüller oyun parasıdır. Klavyeden A, B, C, D tuşlarıyla seçip Enter ile kilitleyebilirsin.</p>
</main>
<script>
(function(){
var PRIZES=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
var SAFE=[4,9];
function tl(n){return n.toLocaleString('tr-TR')+' ₺'}
function time(i){return i<5?30:(i<10?45:60)}
// [kazanım, soru, [doğru, yanlış, yanlış, yanlış], açıklama]
var EASY=[
['FB.6.1.1','Güneş\'e en yakın gezegen hangisidir?',['Merkür','Venüs','Mars','Dünya'],'Güneş\'e en yakın gezegen Merkür\'dür.'],
['FB.6.1.1','Güneş Sistemi\'nde kaç gezegen vardır?',['8','7','9','10'],'Güneş Sistemi\'nde 8 gezegen bulunur.'],
['FB.6.1.1','Güneş Sistemi\'nin en büyük gezegeni hangisidir?',['Jüpiter','Satürn','Dünya','Neptün'],'Jüpiter, Güneş Sistemi\'nin en büyük gezegenidir.'],
['FB.6.1.1','Halkalarıyla en çok tanınan gezegen hangisidir?',['Satürn','Mars','Venüs','Merkür'],'Satürn\'ün büyük ve belirgin halkaları vardır.'],
['FB.6.1.1','Dünya\'nın kaç doğal uydusu vardır?',['1','2','0','8'],'Dünya\'nın tek doğal uydusu Ay\'dır.'],
['FB.6.1.2','Atmosferde yanarak gökyüzünde ışık çizgisi oluşturan gök cismine ne denir?',['Meteor','Asteroit','Gezegen','Uydu'],'Atmosfere giren ve sürtünmeyle yanan küçük cisimlere meteor (akan yıldız) denir.'],
['FB.6.1.3','Güneş tutulmasında Ay nerede bulunur?',['Güneş ile Dünya arasında','Dünya\'nın arkasında','Güneş\'in arkasında','Dünya\'dan çok uzakta'],'Güneş tutulmasında Ay, Güneş ile Dünya\'nın arasına girer.'],
['FB.6.1.4','Ay tutulması hangi Ay evresinde gerçekleşir?',['Dolunay','Yeni Ay','İlk dördün','Hilal'],'Ay tutulması Dünya\'nın Güneş ile Ay arasına girdiği dolunay evresinde olur.'],
['FB.6.2.1','Kuvvetin birimi hangisidir?',['Newton (N)','Kilogram (kg)','Joule (J)','Metre (m)'],'Kuvvet Newton (N) ile ifade edilir.'],
['FB.6.2.1','Duran bir topa vurulunca top hareket eder. Bu, kuvvetin hangi etkisidir?',['Hareketi başlatma','Cismi durdurma','Şekil değiştirme','Yön değiştirme'],'Kuvvet, duran bir cismi harekete geçirebilir.'],
['FB.6.2.1','Aynı yönde uygulanan 5 N ve 3 N\'luk kuvvetlerin bileşkesi kaç N\'dur?',['8 N','2 N','15 N','0 N'],'Aynı yönlü kuvvetlerin bileşkesi toplamlarına eşittir: 5 + 3 = 8 N.'],
['FB.6.2.2','Dengelenmiş kuvvetlerin bileşkesi kaç N\'dur?',['0 N','1 N','10 N','Sonsuz'],'Kuvvetler dengelenmişse bileşke kuvvet sıfırdır.'],
['FB.6.2.1','Kuvvetin büyüklüğünü ölçen alet hangisidir?',['Dinamometre','Termometre','Terazi','Cetvel'],'Kuvvet dinamometre ile ölçülür.']
];
var MED=[
['FB.6.1.1','Aşağıdakilerden hangisi karasal gezegenlerden biridir?',['Mars','Jüpiter','Satürn','Neptün'],'Karasal gezegenler Merkür, Venüs, Dünya ve Mars\'tır.'],
['FB.6.1.1','Aşağıdakilerden hangisi gazsal gezegenlerden biridir?',['Satürn','Dünya','Venüs','Merkür'],'Gazsal gezegenler Jüpiter, Satürn, Uranüs ve Neptün\'dür.'],
['FB.6.1.2','Asteroit kuşağı hangi iki gezegenin yörüngeleri arasında bulunur?',['Mars ve Jüpiter','Dünya ve Mars','Satürn ve Uranüs','Merkür ve Venüs'],'Asteroitlerin çoğu Mars ile Jüpiter arasındaki kuşakta bulunur.'],
['FB.6.1.2','Atmosferde tamamen yanmayıp yeryüzüne ulaşan parçaya ne denir?',['Meteorit','Meteor','Kuyruklu yıldız','Gezegen'],'Yeryüzüne ulaşan göktaşı parçasına meteorit denir.'],
['FB.6.1.3','Güneş tutulması sırasında Ay hangi evrede bulunur?',['Yeni Ay','Dolunay','İlk dördün','Son dördün'],'Güneş tutulması yalnızca Yeni Ay evresinde olur.'],
['FB.6.1.3','Tutulmaların oluşmasını açıklayan temel ilke hangisidir?',['Işığın doğrusal yayılması','Işığın yansıması','Sesin yayılması','Yerçekimi'],'Işık doğrusal yayıldığı için bir cisim ışığı engelleyince gölge oluşur ve tutulma gerçekleşir.'],
['FB.6.1.4','Ay tutulmasında Güneş, Dünya ve Ay hangi sıradadır?',['Güneş – Dünya – Ay','Güneş – Ay – Dünya','Ay – Güneş – Dünya','Dünya – Güneş – Ay'],'Ay tutulmasında Dünya, Güneş ile Ay arasına girer ve Ay Dünya\'nın gölgesine girer.'],
['FB.6.1.3','Güneş tutulması Dünya\'nın nasıl bir bölgesinden görülür?',['Ay\'ın gölgesinin düştüğü sınırlı bir bölgeden','Dünya\'nın her yerinden','Yalnızca gece olan yerlerden','Yalnızca kutuplardan'],'Ay\'ın gölgesi Dünya\'nın yalnızca küçük bir bölümüne düşer; tutulma o bölgelerden görülür.'],
['FB.6.2.1','Zıt yönde uygulanan 10 N ve 4 N\'luk kuvvetlerin bileşkesi nedir?',['6 N, büyük kuvvet yönünde','14 N','6 N, küçük kuvvet yönünde','0 N'],'Zıt yönlü kuvvetlerde büyükten küçük çıkarılır ve bileşke büyük kuvvetin yönündedir: 10 − 4 = 6 N.'],
['FB.6.2.2','Bileşke kuvveti sıfırdan farklı olan cisme etki eden kuvvetler için ne söylenebilir?',['Dengelenmemiştir','Dengelenmiştir','Yoktur','Sıfırdır'],'Bileşke kuvvet 0 değilse kuvvetler dengelenmemiştir ve cismin hareket durumu değişir.'],
['FB.6.2.2','Masanın üzerinde duran bir kitaba etki eden kuvvetler hakkında ne söylenebilir?',['Dengelenmiştir','Dengelenmemiştir','Kitaba kuvvet etki etmez','Yalnızca ağırlığı vardır'],'Kitabın ağırlığı ile masanın tepki kuvveti birbirini dengeler.'],
['FB.6.2.1','Kuvvet çizimlerinde kuvvetin büyüklüğü neyle gösterilir?',['Okun uzunluğuyla','Okun rengiyle','Okun kalınlığıyla','Cismin boyutuyla'],'Kuvvet ok ile gösterilir; ok yönü kuvvetin yönünü, uzunluğu büyüklüğünü belirtir.'],
['FB.6.2.2','Sabit hızla düz yolda giden bir arabaya etki eden kuvvetler hakkında ne söylenebilir?',['Dengelenmiştir','Dengelenmemiştir','Bileşke kuvvet büyüktür','Arabaya kuvvet etki etmez'],'Hızı değişmeyen cisme etki eden kuvvetler dengelenmiştir.']
];
var HARD=[
['FB.6.1.1','Aşağıdaki gezegenlerden hangisinin doğal uydusu yoktur?',['Venüs','Mars','Jüpiter','Dünya'],'Merkür ve Venüs\'ün doğal uydusu yoktur; diğer seçeneklerin uydusu vardır.'],
['FB.6.1.1','Güneş\'e Merkür\'den daha uzak olduğu hâlde Güneş Sistemi\'nin en sıcak gezegeni hangisidir?',['Venüs','Mars','Dünya','Jüpiter'],'Venüs\'ün yoğun atmosferi ısıyı hapseder; bu yüzden en sıcak gezegendir.'],
['FB.6.1.2','Kuyruklu yıldızın kuyruğu nasıl oluşur?',['Güneş\'e yaklaşınca buz ve tozlar buharlaşıp gaz-toz salar','Dünya\'nın çekiminden','Güneş\'ten uzaklaşınca','Ay ile çarpışınca'],'Güneş\'e yaklaşan kuyruklu yıldızın buzları buharlaşır; açığa çıkan gaz ve toz kuyruğu oluşturur.'],
['FB.6.1.3','Ay, Dünya\'dan uzakta iken olan bir Güneş tutulmasında Güneş\'in kenarı halka gibi görünür. Bu tutulma türüne ne denir?',['Halkalı tutulma','Tam tutulma','Kısmi tutulma','Ay tutulması'],'Ay uzakta olduğunda Güneş\'i tamamen örtemez ve Güneş halka gibi görünür.'],
['FB.6.1.4','Ay tutulması, gece olan Dünya\'nın her yerinden görülebilir. Bunun nedeni nedir?',['Ay\'ın tamamının Dünya\'nın gölgesine girmesi','Ay\'ın Dünya\'ya çok yakın olması','Güneş\'in Dünya\'ya çok yakın olması','Dünya\'nın dönmemesi'],'Ay Dünya\'nın gölgesine girdiğinden, Ay\'ı gören herkes tutulmayı izleyebilir.'],
['FB.6.1.3','Güneş tutulması her ay olmaz. Bunun nedeni nedir?',['Ay\'ın yörüngesinin Dünya\'nın yörüngesine göre eğik olması','Ay\'ın her ay küçülmesi','Güneş\'in her ay uzaklaşması','Dünya\'nın her ay dönmemesi'],'Ay\'ın yörüngesi eğik olduğu için üç cisim her ay aynı doğrultuya gelmez.'],
['FB.6.1.3','Güneş\'in tamamının Ay tarafından örtüldüğü tutulma türüne ne denir?',['Tam Güneş tutulması','Kısmi Güneş tutulması','Halkalı tutulma','Ay tutulması'],'Güneş\'in tamamı örtülürse tam Güneş tutulması olur.'],
['FB.6.2.1','Aynı yönlü iki kuvvetin bileşkesi 12 N\'dur. Kuvvetlerden biri 7 N ise diğeri kaç N\'dur?',['5 N','19 N','84 N','12 N'],'Aynı yönde bileşke toplamdır: 12 − 7 = 5 N.'],
['FB.6.2.1','Bir cisme sağa 20 N, sola 35 N kuvvet uygulanıyor. Bileşke kuvvet kaç N ve hangi yöndedir?',['15 N, sola','15 N, sağa','55 N, sola','55 N, sağa'],'Zıt yönlü kuvvetlerde büyükten küçük çıkarılır: 35 − 20 = 15 N, büyük kuvvetin yönü olan sola doğrudur.'],
['FB.6.2.2','İp çekme oyununda iki takım da 40 N kuvvetle çekiyor. İpin hareketi için ne söylenebilir?',['Kuvvetler dengelenmiştir, ip hareket etmez','İp 80 N ile sağa gider','İp 40 N ile sola gider','İp hızlanarak hareket eder'],'Zıt yönlü eşit kuvvetlerin bileşkesi 0 N olduğundan ip durmaya devam eder.'],
['FB.6.2.2','Durmakta olan bir cisme dengelenmemiş bir kuvvet etki ederse ne olur?',['Cisim hareket etmeye başlar','Cisim durmaya devam eder','Cismin kütlesi artar','Cisim küçülür'],'Dengelenmemiş kuvvet cismin hareket durumunu değiştirir; duran cisim harekete geçer.'],
['FB.6.2.2','Paraşütle sabit hızla yere inen kişi için hangisi doğrudur?',['Yukarı doğru hava direnci, aşağı doğru ağırlığa eşittir','Ağırlık hava direncinden büyüktür','Hava direnci ağırlıktan büyüktür','Üzerine kuvvet etki etmez'],'Hız sabit olduğundan kuvvetler dengelenmiştir: hava direnci ağırlığa eşittir.'],
['FB.6.2.2','Dengelenmiş kuvvetlerin etkisindeki bir cisim için hangisi doğrudur?',['Duruyorsa durmaya, hareketliyse sabit hızla hareket etmeye devam eder','Mutlaka durur','Mutlaka hızlanır','Mutlaka yavaşlar'],'Bileşke 0 olduğundan cismin hareket durumu değişmez.']
];
var TIERS=[EASY,MED,HARD];
var Q=[];
function buildQ(){Q=[];TIERS.forEach(function(t){Q=Q.concat(shuffle(t).slice(0,5))})}


var st;
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function safeWon(i){var w=0;SAFE.forEach(function(s){if(i>s)w=PRIZES[s]});return w}
function newGame(){buildQ();st={i:0,jok:{f:true,a:true,p:true},sel:-1,locked:false,over:false,timer:null,left:0,gone:[],msg:'',opts:[],correct:0,answered:0};startQ()}
function startQ(){
 var q=Q[st.i];var idx=shuffle([0,1,2,3]);st.opts=idx;st.correctPos=idx.indexOf(0);
 st.sel=-1;st.locked=false;st.gone=[];st.poll=null;st.msg='';st.reveal=false;st.left=time(st.i);
 clearInterval(st.timer);st.timer=setInterval(tick,250);st.t0=Date.now();
 render();
}
function tick(){
 if(st.locked||st.over)return;
 st.left=Math.max(0,time(st.i)-(Date.now()-st.t0)/1000);
 var bar=document.querySelector('.timer i'),tm=document.querySelector('.timer');
 if(bar){bar.style.width=(st.left/time(st.i)*100)+'%';tm.classList.toggle('low',st.left<=10)}
 var tv=$('tv');if(tv)tv.textContent=Math.ceil(st.left)+' sn';
 if(st.left<=0){clearInterval(st.timer);st.locked=true;st.timeout=true;st.reveal=true;st.msg='<b>Süre doldu!</b> '+Q[st.i][3];render()}
}
function render(){
 var m=$('main');var h='';
 if(st.over){
  var won=st.final;
  h='<div class="center"><div class="tag">MİLYONERFEN · OYUN BİTTİ</div><div class="big">'+tl(won)+'</div><p>'+(won>=1000000?'Tebrikler, <b>6. sınıf fen milyoneri</b> oldun! 🏆':(won>0?'Harika! Bu parayı kazandın.':'Bir dahaki sefere daha iyi olacak!'))+'</p><p class="muted" style="color:var(--muted)">'+st.correct+' soruyu doğru bildin.</p><button class="btn gold" id="again">Yeniden oyna</button></div>';
  m.innerHTML=h;$('again').onclick=newGame;ladder();post();return;
 }
 var q=Q[st.i];
 h+='<div class="top"><span class="chip">Soru <b>'+(st.i+1)+' / 15</b></span><span class="chip">Ödül: <b>'+tl(PRIZES[st.i])+'</b></span><span class="chip">Kazandığın: <b>'+tl(st.i>0?PRIZES[st.i-1]:0)+'</b></span><span class="chip">Süre: <b id="tv">'+Math.ceil(st.left)+' sn</b></span></div>';
 h+='<div class="timer'+(st.left<=10?' low':'')+'"><i style="width:'+(st.left/time(st.i)*100)+'%"></i></div>';
 h+='<div class="tag">'+q[0]+(SAFE.indexOf(st.i)>=0?' · GÜVENLİ BASAMAK':'')+'</div>';
 h+='<div class="q">'+q[1]+'</div><div class="opts">';
 st.opts.forEach(function(oi,p){
  var cls='opt';if(st.gone.indexOf(p)>=0)cls+=' gone';
  if(st.reveal){if(p===st.correctPos)cls+=' ok';else if(p===st.sel)cls+=' bad'}else if(p===st.sel)cls+=' sel';
  var poll=st.poll&&st.poll[p]!=null?'<span class="pc">%'+st.poll[p]+'</span><span class="poll"><i style="width:'+st.poll[p]+'%"></i></span>':'';
  h+='<button class="'+cls+'" data-p="'+p+'"'+(st.locked?' disabled':'')+'><span class="l">'+'ABCD'[p]+':</span><span>'+q[2][oi]+'</span>'+poll+'</button>';
 });
 h+='</div>';
 if(!st.locked&&st.sel>=0)h+='<div class="jok"><span>Son kararın mı?</span><button class="btn gold" id="lock">Evet, kilitle</button><button class="btn" id="cancel">Vazgeç</button></div>';
 if(!st.locked){
  h+='<div class="jok" role="group" aria-label="Jokerler"><button class="btn" id="jf"'+(st.jok.f?'':' disabled')+'>½ Yarı yarıya</button><button class="btn" id="ja"'+(st.jok.a?'':' disabled')+'>👥 Seyirciye sor</button><button class="btn" id="jp"'+(st.jok.p?'':' disabled')+'>📞 Telefon</button><button class="btn" id="quit"'+(st.i>0?'':' disabled')+'>Çekil ('+tl(st.i>0?PRIZES[st.i-1]:0)+')</button></div>';
 }
 if(st.msg)h+='<div class="msg">'+st.msg+'</div>';
 if(st.locked&&!st.over){
  var okAns=st.sel===st.correctPos;
  h+='<div class="jok">'+(st.timeout||!okAns?'<button class="btn gold" id="end">Sonucu gör</button>':(st.i===14?'<button class="btn gold" id="end">Ödülü al 🏆</button>':'<button class="btn gold" id="next">Sonraki soru →</button>'))+'</div>';
 }
 m.innerHTML=h;ladder();bind();post();
}
function ladder(){
 var l=$('ladder');l.innerHTML='';
 for(var i=0;i<15;i++){var li=document.createElement('li');var c='';if(SAFE.indexOf(i)>=0)c+=' safe';if(!st.over&&i===st.i)c+=' cur';else if(st.over?i<st.won:i<st.i)c+=' done';li.className=c.trim();li.innerHTML='<span>'+(i+1)+'</span><span>'+tl(PRIZES[i])+'</span>';l.appendChild(li)}
}
function bind(){
 [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(st.locked)return;st.sel=parseInt(b.getAttribute('data-p'));render()}});
 var e;
 if(e=$('lock'))e.onclick=lock;if(e=$('cancel'))e.onclick=function(){st.sel=-1;render()};
 if(e=$('jf'))e.onclick=j5050;if(e=$('ja'))e.onclick=jAud;if(e=$('jp'))e.onclick=jTel;
 if(e=$('quit'))e.onclick=function(){finish(st.i>0?PRIZES[st.i-1]:0,st.i)};
 if(e=$('next'))e.onclick=function(){st.i++;startQ()};
 if(e=$('end'))e.onclick=function(){if(st.sel===st.correctPos&&!st.timeout)finish(PRIZES[st.i],15);else finish(safeWon(st.i),st.i)};
}
function lock(){
 clearInterval(st.timer);st.locked=true;st.reveal=true;st.answered++;
 var ok=st.sel===st.correctPos;if(ok)st.correct++;
 st.msg=(ok?'<b>Doğru!</b> ':'<b>Yanlış.</b> Doğru cevap: <b>'+'ABCD'[st.correctPos]+'</b>. ')+Q[st.i][3];
 render();
}
function finish(won,upTo){clearInterval(st.timer);st.over=true;st.final=won;st.won=upTo;try{var b=parseInt(localStorage.getItem('milyoner6')||'0');if(won>b)localStorage.setItem('milyoner6',String(won))}catch(e){}render()}
function wrongPositions(){var r=[];for(var p=0;p<4;p++)if(p!==st.correctPos&&st.gone.indexOf(p)<0)r.push(p);return r}
function j5050(){st.jok.f=false;var w=shuffle(wrongPositions()).slice(0,2);st.gone=st.gone.concat(w);if(st.gone.indexOf(st.sel)>=0)st.sel=-1;st.msg='<b>Yarı yarıya:</b> iki yanlış şık elendi.';render()}
function jAud(){
 st.jok.a=false;var alive=[0,1,2,3].filter(function(p){return st.gone.indexOf(p)<0});
 var base=Math.max(38,88-st.i*4)+Math.floor(Math.random()*8-4);
 var rest=100-base,res={};var others=alive.filter(function(p){return p!==st.correctPos});
 var w=others.map(function(){return Math.random()+.2}),sum=w.reduce(function(a,b){return a+b},0),used=0;
 others.forEach(function(p,k){var v=k===others.length-1?rest-used:Math.round(rest*w[k]/sum);res[p]=v;used+=v});
 res[st.correctPos]=base;st.poll=res;st.msg='<b>Seyirci oyu:</b> yüzdeler şıkların yanında gösteriliyor. Seyirci her zaman haklı değildir!';render();
}
function jTel(){
 st.jok.p=false;var sure=Math.random()<Math.max(.45,.95-st.i*.035);var alive=[0,1,2,3].filter(function(p){return st.gone.indexOf(p)<0});
 var pick=sure?st.correctPos:shuffle(alive.filter(function(p){return p!==st.correctPos}))[0];
 var conf=sure?(st.i<8?'Eminim':'Büyük ihtimalle'):'Pek emin değilim ama';
 st.msg='<b>📞 Arkadaşın:</b> "'+conf+', cevap <b>'+'ABCD'[pick]+'</b> olmalı."';render();
}
document.addEventListener('keydown',function(e){
 if(!st||st.over)return;var k=e.key.toUpperCase();var p='ABCD'.indexOf(k);
 if(p>=0&&!st.locked&&st.gone.indexOf(p)<0){st.sel=p;render()}
 else if(e.key==='Enter'){if(!st.locked&&st.sel>=0)lock();else if(st.locked){var b=$('next')||$('end');if(b)b.click()}}
});
function post(){try{parent.postMessage({type:'html-anim-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
window.addEventListener('load',post);window.addEventListener('resize',post);
if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
try{parent.postMessage({type:'html-anim-ready'},'*')}catch(e){}
newGame();
})();
</script>
