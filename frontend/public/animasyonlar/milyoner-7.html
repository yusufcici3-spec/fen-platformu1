<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MilyonerFen: 7. Sınıf Fen Bilimleri</title>
<style>
:root{--ink:#eef2ff;--muted:#a9b4d6;--gold:#fbbf24;--blue:#1e3a8a;--deep:#0a1030;--panel:#101a4a;--line:#3b4f9e;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1050px;margin:auto;padding:12px}

.chip{background:#0b1450;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.chip b{color:var(--gold)}
.timer{height:14px;background:#0b1450;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}

.timer.low i{background:#ef4444}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.q{font-size:18px}}
.opt{position:relative;text-align:left;border:2px solid var(--line);background:linear-gradient(180deg,#14236b,#0b1450);color:var(--ink);border-radius:999px;padding:11px 18px;font:700 16px system-ui,sans-serif;cursor:pointer;min-height:52px;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .l{color:var(--gold);font-weight:900}
.opt.sel{background:linear-gradient(180deg,#b45309,#78350f);border-color:var(--gold)}
.opt.ok{background:linear-gradient(180deg,#16a34a,#14532d);border-color:#86efac;animation:blink .5s 3}
.opt.bad{background:linear-gradient(180deg,#dc2626,#7f1d1d);border-color:#fca5a5}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.opt .poll{position:absolute;left:18px;right:18px;bottom:3px;height:4px;border-radius:4px;background:#ffffff22;overflow:hidden}
.opt .poll i{display:block;height:100%;background:var(--gold)}
.opt .pc{margin-left:auto;font-size:13px;color:var(--gold)}
@keyframes blink{50%{filter:brightness(1.6)}}
.btn{border:2px solid var(--line);background:#0b1450;color:var(--ink);border-radius:12px;padding:9px 14px;font:700 15px system-ui,sans-serif;cursor:pointer;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold);color:#1f1300;border-color:var(--gold)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
.jok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.msg{margin-top:12px;background:#0b1450;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
.msg b{color:var(--gold)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:3px}
.ladder li{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:14px;color:var(--muted)}
.ladder li.safe{color:#fff}
.ladder li.cur{background:var(--gold);color:#1f1300}
.ladder li.done{color:#86efac}
.center{text-align:center;padding:24px 8px}
.big{font-size:42px;font-weight:900;color:var(--gold);margin:8px 0}
.note{font-size:13px;color:var(--muted);margin:12px 4px 0}
@media (prefers-reduced-motion:reduce){.opt.ok{animation:none}.timer i{transition:none}}
</style></head><body>
<main class="app">
<div class="game">
 <section aria-live="polite" id="main"></section>

</div>
<p class="note">Sorular 7. sınıf Fen Bilimleri 1. ünite (Uzay Araştırmaları) ve 2. ünite (Kuvvet ve Enerji) kazanımlarından hazırlanmıştır. Ödüller oyun parasıdır. Klavyeden A, B, C, D tuşlarıyla seçip Enter ile kilitleyebilirsin.</p>
</main>
<script>

['FB.7.2.1','Aşağıdakilerden hangisinde fiziksel anlamda iş yapılır?',['Yerdeki kutuyu iterek yerini değiştirmek','Duvarı itmek, ama duvar hiç kımıldamıyor','Elinde çanta tutarak ayakta beklemek','Sırada oturup ders çalışmak'],'Fiziksel anlamda iş yapılabilmesi için cisme kuvvet uygulanmalı ve cisim kuvvet doğrultusunda yer değiştirmelidir.'],

['FB.7.1.1','Gezegenlerin yakınından geçerek bilgi toplayan, insansız uzay aracına ne ad verilir?',['Uzay sondası','Uzay istasyonu','Takımyıldızı','Meteor'],'Uzay sondaları, gezegenleri ve diğer gök cisimlerini yakından inceleyen insansız araçlardır.'],
['FB.7.1.3','Uzay araştırmalarının yol açtığı problemlerden biri aşağıdakilerden hangisidir?',['Uzay çöplerinin artması','Gezegenlerin yer değiştirmesi','Güneş\'in sönmesi','Ay\'ın büyümesi'],'Kullanım dışı uydu ve roket parçaları uzayda çöp olarak birikir ve yeni araçlar için tehlike oluşturur.'],
['FB.7.1.4','Yıldızların doğduğu gaz ve toz bulutlarına ne ad verilir?',['Bulutsu (nebula)','Kara delik','Galaksi','Kuyruklu yıldız'],'Yıldızlar, bulutsu adı verilen gaz ve toz bulutlarının çekimle toplanmasıyla oluşur.'],

['FB.7.2.1','100 N\'luk kuvvet, bir cismi kuvvet yönünde 5 m yer değiştiriyor. Yapılan iş kaç joule\'dür?',['500 J','20 J','105 J','95 J'],'İş = kuvvet × yer değiştirme = 100 N × 5 m = 500 J.'],
['FB.7.1.5','Aşağıdaki sıralamalardan hangisi küçükten büyüğe doğrudur?',['Yıldız – Galaksi – Evren','Galaksi – Yıldız – Evren','Evren – Galaksi – Yıldız','Yıldız – Evren – Galaksi'],'Yıldızlar galaksileri, galaksiler de evreni oluşturur.'],
['FB.7.2.3','Sürtünmesiz bir sarkaç ulaşabildiği en yüksek noktada iken hangi enerjisi en büyüktür?',['Çekim potansiyel enerjisi','Kinetik enerjisi','Isı enerjisi','Hepsi sıfırdır'],'En yüksek noktada hız sıfırdır; kinetik enerji sıfır, çekim potansiyel enerjisi en büyüktür.'],
['FB.7.2.1','Yatay yolda yürüyen biri 30 N\'luk çantayı yukarı doğru tutarak 10 m yürüyor. Çantaya uygulanan kuvvetin yaptığı iş kaç joule\'dür?',['0 J','30 J','300 J','3 J'],'Kuvvet dikey, yer değiştirme yataydır. Kuvvet doğrultusunda yer değiştirme olmadığından iş sıfırdır.'],
['FB.7.1.4','Güneş\'ten çok daha büyük kütleli bir yıldız süpernova olarak patladıktan sonra çekirdeği ne olabilir?',['Nötron yıldızı veya kara delik','Beyaz cüce','Kızıl dev','Bulutsu'],'Çok büyük kütleli yıldızların çekirdeği süpernovadan sonra nötron yıldızına veya kara deliğe dönüşür.'],
['FB.7.2.3','Enerjinin korunumu ilkesi aşağıdakilerden hangisidir?',['Enerji yoktan var edilemez, yok edilemez; bir türden diğerine dönüşür','Enerji sürtünmeyle tamamen yok olur','Kinetik enerji hiçbir zaman potansiyel enerjiye dönüşmez','Enerji yalnızca ısıdan oluşur'],'Enerji yoktan var edilemez ve yok edilemez; bir türden diğerine dönüşür. Toplam enerji korunur.'],
['FB.7.2.3','Sürtünmesiz ortamda yukarıdan serbest bırakılan cismin ilk çekim potansiyel enerjisi 40 J ise yere çarpmadan hemen önceki kinetik enerjisi kaç joule\'dür?',['40 J','20 J','80 J','0 J'],'Sürtünme yoksa potansiyel enerjinin tamamı kinetik enerjiye dönüşür; toplam enerji korunur.']
];var NEWE=[
['FB.7.1.1','Ay\'a ayak basan ilk insanları götüren uzay görevi hangisidir?',['Apollo 11','Voyager 1','Hubble','Sputnik'],'Ay\'a ilk insanlı iniş 1969\'da Apollo 11 görevi ile gerçekleşti.'],
['FB.7.1.2','Uzaydaki gök cisimlerini uzaktan incelemek için hangi alet kullanılır?',['Teleskop','Mikroskop','Termometre','Barometre'],'Teleskoplar uzak gök cisimlerini büyüterek gözlemlememizi sağlar.'],
['FB.7.1.1','Dünya etrafında dolanan insan yapımı cisimlere ne denir?',['Yapay uydu','Uzay sondası','Asteroit','Meteor'],'Dünya çevresinde dolanan insan yapımı cisimler yapay uydulardır.'],
['FB.7.1.5','Güneş Sistemi\'nin merkezinde ne bulunur?',['Güneş','Dünya','Ay','Jüpiter'],'Güneş Sistemi\'nin merkezinde, sistemin en büyük cismi olan Güneş yer alır.'],
['FB.7.2.2','Çekim potansiyel enerjisi hangi büyüklüklere bağlıdır?',['Kütle ve yükseklik','Hız ve kütle','Hacim ve sıcaklık','Renk ve şekil'],'Çekim potansiyel enerjisi cismin kütlesine ve yerden yüksekliğine bağlıdır.'],
['FB.7.2.1','İşin birimi aşağıdakilerden hangisidir?',['Joule (J)','Newton (N)','Watt (W)','Kilogram (kg)'],'İş ve enerji joule (J) birimiyle ifade edilir.'],
['FB.7.2.2','Gerilmiş bir yayın sahip olduğu enerji türü hangisidir?',['Esneklik potansiyel enerjisi','Kinetik enerji','Çekim potansiyel enerjisi','Nükleer enerji'],'Sıkıştırılmış veya gerilmiş yayların sahip olduğu enerji esneklik potansiyel enerjisidir.'],
['FB.7.2.3','Güneş enerjisiyle çalışan hesap makinesinde hangi enerji dönüşümü olur?',['Işık enerjisi → elektrik enerjisi','Elektrik enerjisi → ışık enerjisi','Isı enerjisi → hareket enerjisi','Kimyasal enerji → ışık enerjisi'],'Güneş pilleri ışık enerjisini elektrik enerjisine dönüştürür.']
];
var NEWM=[
['FB.7.1.1','Astronotların uzun süre yaşayıp araştırma yaptığı, Dünya çevresinde dolanan yapıya ne denir?',['Uzay istasyonu','Uzay sondası','Teleskop','Roket'],'Uzay istasyonları astronotların haftalarca, aylarca kaldığı ve deneyler yaptığı yapılardır.'],
['FB.7.1.3','Aşağıdakilerden hangisi uzay araştırmalarının günlük yaşama katkısıdır?',['Konum belirleme (GPS) ve hava durumu tahminleri','Gece ve gündüzün oluşması','Mevsimlerin değişmesi','Ay\'ın evreleri'],'Uydular GPS, haberleşme ve hava durumu tahmini gibi birçok alanda hayatımızı kolaylaştırır.'],
['FB.7.1.4','Yıldızların renkleri en çok hangi özelliklerine bağlıdır?',['Yüzey sıcaklıkları','Dünya\'ya uzaklıkları','Dönme yönleri','Sahip oldukları uydular'],'Yıldızların rengi yüzey sıcaklığıyla ilgilidir; çok sıcak yıldızlar mavi, daha soğuk olanlar kırmızı görünür.'],
['FB.7.1.5','Işık yılı hangi büyüklüğün birimidir?',['Uzaklık','Zaman','Hız','Kütle'],'Işık yılı, ışığın bir yılda aldığı yoldur; bir uzaklık birimidir.'],
['FB.7.2.1','20 N\'luk kuvvet bir cismi kuvvet yönünde 3 m yer değiştiriyor. Yapılan iş kaç joule\'dür?',['60 J','23 J','17 J','6,7 J'],'İş = kuvvet × yer değiştirme = 20 N × 3 m = 60 J.'],
['FB.7.2.2','Kütleleri aynı iki cisimden hızı büyük olanın kinetik enerjisi için ne söylenebilir?',['Daha büyüktür','Daha küçüktür','Eşittir','Sıfırdır'],'Kinetik enerji hızla ilişkilidir; hız arttıkça kinetik enerji artar.'],
['FB.7.2.3','Serbest bırakılan bir cismin yere doğru düşerken enerji dönüşümü nasıldır?',['Çekim potansiyel enerjisi kinetik enerjiye dönüşür','Kinetik enerji potansiyel enerjiye dönüşür','Enerji yok olur','Isı enerjisi ışığa dönüşür'],'Düşerken yükseklik azaldığı için potansiyel enerji azalır, hız arttığı için kinetik enerji artar.'],
['FB.7.2.3','Hidroelektrik santralde enerji dönüşümü hangi sırayla gerçekleşir?',['Çekim potansiyel → kinetik → elektrik enerjisi','Isı → ışık → elektrik enerjisi','Elektrik → kinetik → ısı enerjisi','Kimyasal → ışık → kinetik enerji'],'Barajdaki suyun potansiyel enerjisi akarken kinetik enerjiye, türbin ve jeneratörde elektrik enerjisine dönüşür.']
];
var NEWH=[
['FB.7.2.1','Bir kuvvet cisme 50 J iş yapıyor. Kuvvet 10 N ise cisim kuvvet yönünde kaç m yer değiştirmiştir?',['5 m','500 m','0,2 m','60 m'],'İş = kuvvet × yer değiştirme, yani yer değiştirme = 50 J ÷ 10 N = 5 m.'],
['FB.7.2.2','Kütlesi 2 kg olan cisim yerden 5 m yüksekte. g = 10 N/kg alınırsa çekim potansiyel enerjisi kaç J\'dür?',['100 J','10 J','50 J','7 J'],'Ep = m·g·h = 2 × 10 × 5 = 100 J.'],
['FB.7.2.2','Aynı hızla giden bir otobüs ve bir bisikletten hangisinin kinetik enerjisi daha büyüktür?',['Otobüsün','Bisikletin','İkisinin de aynıdır','İkisinin de sıfırdır'],'Hız aynıysa kütlesi büyük olanın kinetik enerjisi daha büyüktür.'],

['FB.7.1.4','Güneş benzeri bir yıldızın yaşam sürecinin son evresi hangisidir?',['Beyaz cüce','Süpernova','Kara delik','Nötron yıldızı'],'Güneş gibi orta kütleli yıldızlar dış katmanlarını atıp beyaz cüceye dönüşür.'],
['FB.7.1.3','Uzayda uzun süre kalan astronotlarda ağırlıksızlık nedeniyle hangi sorun görülür?',['Kas ve kemik kaybı','Boyun kısalması','Gözlerin renginin değişmesi','Saç rengi kaybı'],'Ağırlıksız ortamda kaslar ve kemikler az çalıştığı için zayıflar; astronotlar bu nedenle düzenli egzersiz yapar.'],
['FB.7.2.1','Aynı yol boyunca uygulanan kuvvet iki katına çıkarılırsa yapılan iş nasıl değişir?',['İki katına çıkar','Yarıya iner','Değişmez','Dört katına çıkar'],'İş = kuvvet × yer değiştirme; yer değiştirme sabitken kuvvet iki katına çıkarsa iş de iki katına çıkar.'],
['FB.7.1.5','Güneş\'in içinde bulunduğu Samanyolu Galaksisi şekil olarak hangi türdendir?',['Sarmal (spiral)','Küresel','Düzensiz','Halka'],'Samanyolu, kolları olan sarmal bir galaksidir.']
];
var TIERS=[BANK.slice(0,5).concat(NEWE),BANK.slice(5,10).concat(NEWM),BANK.slice(10,15).concat(NEWH)];
var Q=[];
function buildQ(){Q=[];TIERS.forEach(function(t){Q=Q.concat(shuffle(t).slice(0,5))})}

var st;
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function safeWon(i){var w=0;SAFE.forEach(function(s){if(i>s)w=PRIZES[s]});return w}
function newGame(){buildQ();st={i:0,jok:{f:true,a:true,p:true},sel:-1,locked:false,over:false,timer:null,left:0,gone:[],msg:'',opts:[],correct:0,answered:0};startQ()}
function startQ(){
 var q=Q[st.i];var idx=shuffle([0,1,2,3]);st.opts=idx;st.correctPos=idx.indexOf(0);
 st.sel=-1;st.locked=false;st.gone=[];st.poll=null;st.msg='';st.reveal=false;st.left=time(st.i);
 clearInterval(st.timer);st.timer=setInterval(tick,250);st.t0=Date.now();
 render();
}
function tick(){
 if(st.locked||st.over)return;
 st.left=Math.max(0,time(st.i)-(Date.now()-st.t0)/1000);
 var bar=document.querySelector('.timer i'),tm=document.querySelector('.timer');
 if(bar){bar.style.width=(st.left/time(st.i)*100)+'%';tm.classList.toggle('low',st.left<=10)}
 var tv=$('tv');if(tv)tv.textContent=Math.ceil(st.left)+' sn';
 if(st.left<=0){clearInterval(st.timer);st.locked=true;st.timeout=true;st.reveal=true;st.msg='<b>Süre doldu!</b> '+Q[st.i][3];render()}
}
function render(){
 var m=$('main');var h='';
 if(st.over){
  var won=st.final;
  h='<div class="center"><div class="tag">MİLYONERFEN · OYUN BİTTİ</div><div class="big">'+tl(won)+'</div><p>'+(won>=1000000?'Tebrikler, <b>7. sınıf fen milyoneri</b> oldun! 🏆':(won>0?'Harika! Bu parayı kazandın.':'Bir dahaki sefere daha iyi olacak!'))+'</p><p class="muted" style="color:var(--muted)">'+st.correct+' soruyu doğru bildin.</p><button class="btn gold" id="again">Yeniden oyna</button></div>';
  m.innerHTML=h;$('again').onclick=newGame;ladder();post();return;
 }
 var q=Q[st.i];
 h+='<div class="top"><span class="chip">Soru <b>'+(st.i+1)+' / 15</b></span><span class="chip">Ödül: <b>'+tl(PRIZES[st.i])+'</b></span><span class="chip">Kazandığın: <b>'+tl(st.i>0?PRIZES[st.i-1]:0)+'</b></span><span class="chip">Süre: <b id="tv">'+Math.ceil(st.left)+' sn</b></span></div>';
 h+='<div class="timer'+(st.left<=10?' low':'')+'"><i style="width:'+(st.left/time(st.i)*100)+'%"></i></div>';
 h+='<div class="tag">'+q[0]+(SAFE.indexOf(st.i)>=0?' · GÜVENLİ BASAMAK':'')+'</div>';
 h+='<div class="q">'+q[1]+'</div><div class="opts">';
 st.opts.forEach(function(oi,p){
  var cls='opt';if(st.gone.indexOf(p)>=0)cls+=' gone';
  if(st.reveal){if(p===st.correctPos)cls+=' ok';else if(p===st.sel)cls+=' bad'}else if(p===st.sel)cls+=' sel';
  var poll=st.poll&&st.poll[p]!=null?'<span class="pc">%'+st.poll[p]+'</span><span class="poll"><i style="width:'+st.poll[p]+'%"></i></span>':'';
  h+='<button class="'+cls+'" data-p="'+p+'"'+(st.locked?' disabled':'')+'><span class="l">'+'ABCD'[p]+':</span><span>'+q[2][oi]+'</span>'+poll+'</button>';
 });
 h+='</div>';
 if(!st.locked&&st.sel>=0)h+='<div class="jok"><span>Son kararın mı?</span><button class="btn gold" id="lock">Evet, kilitle</button><button class="btn" id="cancel">Vazgeç</button></div>';
 if(!st.locked){
  h+='<div class="jok" role="group" aria-label="Jokerler"><button class="btn" id="jf"'+(st.jok.f?'':' disabled')+'>½ Yarı yarıya</button><button class="btn" id="ja"'+(st.jok.a?'':' disabled')+'>👥 Seyirciye sor</button><button class="btn" id="jp"'+(st.jok.p?'':' disabled')+'>📞 Telefon</button><button class="btn" id="quit"'+(st.i>0?'':' disabled')+'>Çekil ('+tl(st.i>0?PRIZES[st.i-1]:0)+')</button></div>';
 }
 if(st.msg)h+='<div class="msg">'+st.msg+'</div>';
 if(st.locked&&!st.over){
  var okAns=st.sel===st.correctPos;
  h+='<div class="jok">'+(st.timeout||!okAns?'<button class="btn gold" id="end">Sonucu gör</button>':(st.i===14?'<button class="btn gold" id="end">Ödülü al 🏆</button>':'<button class="btn gold" id="next">Sonraki soru →</button>'))+'</div>';
 }
 m.innerHTML=h;ladder();bind();post();
}
function ladder(){
 var l=$('ladder');l.innerHTML='';
 for(var i=0;i<15;i++){var li=document.createElement('li');var c='';if(SAFE.indexOf(i)>=0)c+=' safe';if(!st.over&&i===st.i)c+=' cur';else if(st.over?i<st.won:i<st.i)c+=' done';li.className=c.trim();li.innerHTML='<span>'+(i+1)+'</span><span>'+tl(PRIZES[i])+'</span>';l.appendChild(li)}
}
function bind(){
 [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(st.locked)return;st.sel=parseInt(b.getAttribute('data-p'));render()}});
 var e;
 if(e=$('lock'))e.onclick=lock;if(e=$('cancel'))e.onclick=function(){st.sel=-1;render()};
 if(e=$('jf'))e.onclick=j5050;if(e=$('ja'))e.onclick=jAud;if(e=$('jp'))e.onclick=jTel;
 if(e=$('quit'))e.onclick=function(){finish(st.i>0?PRIZES[st.i-1]:0,st.i)};
 if(e=$('next'))e.onclick=function(){st.i++;startQ()};
 if(e=$('end'))e.onclick=function(){if(st.sel===st.correctPos&&!st.timeout)finish(PRIZES[st.i],15);else finish(safeWon(st.i),st.i)};
}
function lock(){
 clearInterval(st.timer);st.locked=true;st.reveal=true;st.answered++;
 var ok=st.sel===st.correctPos;if(ok)st.correct++;
 st.msg=(ok?'<b>Doğru!</b> ':'<b>Yanlış.</b> Doğru cevap: <b>'+'ABCD'[st.correctPos]+'</b>. ')+Q[st.i][3];
 render();
}
function finish(won,upTo){clearInterval(st.timer);st.over=true;st.final=won;st.won=upTo;try{var b=parseInt(localStorage.getItem('milyoner7')||'0');if(won>b)localStorage.setItem('milyoner7',String(won))}catch(e){}render()}
function wrongPositions(){var r=[];for(var p=0;p<4;p++)if(p!==st.correctPos&&st.gone.indexOf(p)<0)r.push(p);return r}
function j5050(){st.jok.f=false;var w=shuffle(wrongPositions()).slice(0,2);st.gone=st.gone.concat(w);if(st.gone.indexOf(st.sel)>=0)st.sel=-1;st.msg='<b>Yarı yarıya:</b> iki yanlış şık elendi.';render()}
function jAud(){
 st.jok.a=false;var alive=[0,1,2,3].filter(function(p){return st.gone.indexOf(p)<0});
 var base=Math.max(38,88-st.i*4)+Math.floor(Math.random()*8-4);
 var rest=100-base,res={};var others=alive.filter(function(p){return p!==st.correctPos});
 var w=others.map(function(){return Math.random()+.2}),sum=w.reduce(function(a,b){return a+b},0),used=0;
 others.forEach(function(p,k){var v=k===others.length-1?rest-used:Math.round(rest*w[k]/sum);res[p]=v;used+=v});
 res[st.correctPos]=base;st.poll=res;st.msg='<b>Seyirci oyu:</b> yüzdeler şıkların yanında gösteriliyor. Seyirci her zaman haklı değildir!';render();
}
function jTel(){
 st.jok.p=false;var sure=Math.random()<Math.max(.45,.95-st.i*.035);var alive=[0,1,2,3].filter(function(p){return st.gone.indexOf(p)<0});
 var pick=sure?st.correctPos:shuffle(alive.filter(function(p){return p!==st.correctPos}))[0];
 var conf=sure?(st.i<8?'Eminim':'Büyük ihtimalle'):'Pek emin değilim ama';
 st.msg='<b>📞 Arkadaşın:</b> "'+conf+', cevap <b>'+'ABCD'[pick]+'</b> olmalı."';render();
}
document.addEventListener('keydown',function(e){
 if(!st||st.over)return;var k=e.key.toUpperCase();var p='ABCD'.indexOf(k);
 if(p>=0&&!st.locked&&st.gone.indexOf(p)<0){st.sel=p;render()}
 else if(e.key==='Enter'){if(!st.locked&&st.sel>=0)lock();else if(st.locked){var b=$('next')||$('end');if(b)b.click()}}
});
function post(){try{parent.postMessage({type:'html-anim-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
window.addEventListener('load',post);window.addEventListener('resize',post);
if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
try{parent.postMessage({type:'html-anim-ready'},'*')}catch(e){}
newGame();
})();
</script>
</body></html>
