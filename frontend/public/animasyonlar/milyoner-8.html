let audioCtx=null,soundOn=true,lastTick=-1;
function audioReady(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,duration,shape='sine',volume=.07,delay=0){if(!soundOn)return;const ctx=audioReady();if(!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=shape;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.03)}
function playCorrect(){tone(660,.16,'sine',.09);tone(880,.18,'sine',.09,.13);tone(1100,.28,'sine',.08,.28)}
function playWrong(){tone(220,.28,'triangle',.11);tone(165,.42,'triangle',.09,.2)}
function playTick(){tone(880,.055,'square',.035)}

function begin(){audioReady();lastTick=-1;let ids=[...document.querySelectorAll('[name=unit]:checked')].map(x=>+x.value);if(!ids.length){alert('En az bir ünite seçmelisin.');return}bank=ids.flatMap(i=>raw[i].map(q=>({unit:U[i],q:q[0],opts:q[1],correct:q[2]})));st={i:0,correct:0,sel:-1,locked:false,over:false,jok:{half:true,audience:true,phone:true},remaining:shuffle(bank).slice(0,15),gone:[],time:30};renderQ()}
function renderQ(){clearInterval(st.timer);let item=st.remaining[st.i];st.opts=shuffle([0,1,2,3]);st.correctPos=st.opts.indexOf(item.correct);st.sel=-1;st.locked=false;st.gone=[];st.time=st.i<5?30:st.i<10?45:60;st.started=Date.now();let m=$('main');m.innerHTML='<div class="top"><span class="chip">Soru <b>'+(st.i+1)+'/15</b></span><span class="chip">Ödül <b>'+money(PRIZES[st.i])+'</b></span><span class="chip">Süre <b id="time">'+st.time+' sn</b></span></div><div class="timer"><i id="bar"></i></div><div class="row" id="soundGame"></div><div class="tag">'+item.unit[0]+' · '+item.unit[1]+'</div><div class="q">'+item.q+'</div><div class="opts" id="opts"></div><div class="row" id="actions"></div><div class="msg" id="msg">Doğru seçeneği işaretle, ardından son kararını ver.</div>';$('soundGame').appendChild(soundButton());item.opts= item.opts;item.opts.forEach((_,i)=>{});st.opts.forEach((oi,p)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+'ABCD'[p]+'.</b><span>'+item.opts[oi]+'</span>';b.onclick=()=>{if(st.locked)return;st.sel=p;document.querySelectorAll('.opt').forEach(x=>x.style.borderColor='var(--line)');b.style.borderColor='var(--gold)';$('actions').innerHTML='<button class="btn gold" id="lock">Son kararım</button>'; $('lock').onclick=lock};$('opts').appendChild(b)});const jok=$('actions');['half','audience','phone'].forEach((key,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=['½ Yarı yarıya','👥 Seyirci','📞 Telefon'][i];b.disabled=!st.jok[key];b.onclick=()=>joker(key);jok.appendChild(b)});let quit=document.createElement('button');quit.className='btn';quit.textContent='Çekil';quit.onclick=()=>finish(st.i?PRIZES[st.i-1]:0);jok.appendChild(quit);st.timer=setInterval(tick,250);ladder()}
function tick(){if(st.locked||st.over)return;let left=Math.max(0,(st.i<5?30:st.i<10?45:60)-(Date.now()-st.started)/1000);let sec=Math.ceil(left);$('time').textContent=sec+' sn';if(sec<=5&&sec>0&&sec!==lastTick){playTick();lastTick=sec;}$('bar').style.width=(left/(st.i<5?30:st.i<10?45:60)*100)+'%';if(left<=0){st.locked=true;playWrong();reveal(false,'Süre doldu!');}}
function lock(){if(st.sel<0)return;st.locked=true;let good=st.sel===st.correctPos;if(good){st.correct++;playCorrect();reveal(true,'Doğru cevap!');}else{playWrong();reveal(false,'Yanlış cevap.');}}
function reveal(good,msg){clearInterval(st.timer);let item=st.remaining[st.i];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===st.correctPos)b.classList.add('ok');else if(i===st.sel)b.classList.add('bad')});$('msg').innerHTML='<b>'+msg+'</b><br>'+item.opts[item.correct];let a=$('actions');a.innerHTML='';let b=document.createElement('button');b.className='btn gold';b.textContent=good?(st.i===14?'Sonucu gör':'Sonraki soru →'):'Oyunu bitir';b.onclick=()=>good&&st.i<14?(st.i++,renderQ()):finish(good?PRIZES[st.i]:st.i>4?PRIZES[4]:0);a.appendChild(b)}
function joker(k){if(!st.jok[k]||st.locked)return;st.jok[k]=false;let item=st.remaining[st.i];if(k==='half'){let wrong=st.opts.map((x,i)=>x!==item.correct?i:-1).filter(x=>x>=0);shuffle(wrong).slice(0,2).forEach(i=>{document.querySelectorAll('.opt')[i].disabled=true;document.querySelectorAll('.opt')[i].style.visibility='hidden'})}else{let text=k==='audience'?'Seyirci çoğunlukla '+ 'ABCD'[st.correctPos]+' seçeneğini öneriyor.':'Telefon jokeri '+ 'ABCD'[st.correctPos]+' seçeneğini öneriyor.';$('msg').textContent=text}renderJokers()}
function renderJokers(){document.querySelectorAll('#actions .btn').forEach(b=>{if(b.textContent.includes('Yarı'))b.disabled=!st.jok.half;if(b.textContent.includes('Seyirci'))b.disabled=!st.jok.audience;if(b.textContent.includes('Telefon'))b.disabled=!st.jok.phone})}
function finish(prize){clearInterval(st.timer);st.over=true;let m=$('main');m.innerHTML='<div class="center"><div class="tag">MİLYONERFEN 8 · OYUN BİTTİ</div><div class="big">'+money(prize)+'</div><h2>'+(prize===1000000?'Tebrikler, fen milyonerisin! 🏆':'Yarışma tamamlandı!')+'</h2><p>'+st.correct+'/15 doğru cevap</p><button class="btn gold" id="again">Yeniden oyna</button></div>';$('again').onclick=setup;ladder()}
setup();
})();
</script></body></html>
