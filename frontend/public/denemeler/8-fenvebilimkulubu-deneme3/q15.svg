<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#12263a"><rect x="1" y="1" width="638" height="360" rx="14" fill="#fbfefd" stroke="#bfe3de" stroke-width="2"/><text x="320.0" y="30.0" text-anchor="middle" font-size="16" font-weight="700" fill="#12263a" >Dört farklı canlıda gözlenen özellik değişimleri</text><rect x="14.0" y="50.0" width="610.0" height="46.0" rx="0" fill="#e0f2f1" stroke="#94a3b8" stroke-width="1.2" /><text x="37.0" y="77.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" ></text><text x="262.0" y="77.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >Gözlenen durum</text><text x="544.0" y="69.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >DNA dizisi</text><text x="544.0" y="85.7" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >karşılaştırması</text><rect x="14.0" y="96.0" width="610.0" height="62.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="131.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >K</text><text x="68.0" y="123.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Aynı bitkiden alınan iki marul fidesinden biri güneşte,</text><text x="68.0" y="139.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >diğeri gölgede büyütüldü; gölgedekinin yaprakları soluk kaldı.</text><text x="544.0" y="131.6" text-anchor="middle" font-size="13" font-weight="400" fill="#12263a" >Değişim yok</text><rect x="14.0" y="158.0" width="610.0" height="62.0" rx="0" fill="#f6fbfa" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="193.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >L</text><text x="68.0" y="185.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Normal bacaklı koyun sürüsünde kısa bacaklı bir kuzu</text><text x="68.0" y="201.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >doğdu; kuzunun yavruları da kısa bacaklı oldu.</text><text x="544.0" y="193.6" text-anchor="middle" font-size="13" font-weight="400" fill="#12263a" >Değişim var</text><rect x="14.0" y="220.0" width="610.0" height="62.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="255.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >M</text><text x="68.0" y="247.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Yazın uzun süre güneşte kalan Selim'in derisi koyulaştı;</text><text x="68.0" y="263.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >kış gelince derisi eski rengine döndü.</text><text x="544.0" y="255.6" text-anchor="middle" font-size="13" font-weight="400" fill="#12263a" >Değişim yok</text><rect x="14.0" y="282.0" width="610.0" height="62.0" rx="0" fill="#f6fbfa" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="317.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >N</text><text x="68.0" y="309.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Kırmızı gözlü sinek ailesinde beyaz gözlü bir birey doğdu;</text><text x="68.0" y="325.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >bu bireyin yavruları da beyaz gözlü oldu.</text><text x="544.0" y="317.6" text-anchor="middle" font-size="13" font-weight="400" fill="#12263a" >Değişim var</text><line x1="60.0" y1="50.0" x2="60.0" y2="344.0" stroke="#cbd5e1" stroke-width="1" /><line x1="464.0" y1="50.0" x2="464.0" y2="344.0" stroke="#cbd5e1" stroke-width="1" /></svg>