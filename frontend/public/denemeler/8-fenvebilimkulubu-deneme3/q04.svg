eçer.</text><text x="530.0" y="173.9" text-anchor="middle" font-size="14" font-weight="400" fill="#12263a" >Uzun yıllar (en az 30 yıl)</text><rect x="20.0" y="194.0" width="600.0" height="50.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="45.0" y="223.9" text-anchor="middle" font-size="14" font-weight="700" fill="#12263a" >M</text><text x="78.0" y="215.2" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >Yarın İstanbul'da hava parçalı bulutlu ve</text><text x="78.0" y="232.7" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >rüzgârlı olacak.</text><text x="530.0" y="223.9" text-anchor="middle" font-size="14" font-weight="400" fill="#12263a" >Bir gün</text><rect x="20.0" y="244.0" width="600.0" height="50.0" rx="0" fill="#f6fbfa" stroke="#cbd5e1" stroke-width="1" /><text x="45.0" y="273.9" text-anchor="middle" font-size="14" font-weight="700" fill="#12263a" >N</text><text x="78.0" y="265.2" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >Erzurum'da kışlar uzun ve karlı, yazlar kısa ve</text><text x="78.0" y="282.7" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >serin geçer.</text><text x="530.0" y="273.9" text-anchor="middle" font-size="14" font-weight="400" fill="#12263a" >Uzun yıllar (en az 30 yıl)</text><rect x="20.0" y="294.0" width="600.0" height="50.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="45.0" y="323.9" text-anchor="middle" font-size="14" font-weight="700" fill="#12263a" >O</text><text x="78.0" y="315.2" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >Bu sabah Ankara'da yoğun sis nedeniyle görüş</text><text x="78.0" y="332.7" text-anchor="start" font-size="14" font-weight="400" fill="#12263a" >mesafesi 200 m'ye düştü.</text><text x="530.0" y="323.9" text-anchor="middle" font-size="14" font-weight="400" fill="#12263a" >Birkaç saat</text><line x1="70.0" y1="48.0" x2="70.0" y2="344.0" stroke="#cbd5e1" stroke-wid