<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#12263a"><rect x="1" y="1" width="638" height="330" rx="14" fill="#fbfefd" stroke="#bfe3de" stroke-width="2"/><text x="320.0" y="30.0" text-anchor="middle" font-size="16" font-weight="700" fill="#12263a" >Dört farklı biyoteknolojik uygulama</text><rect x="14.0" y="50.0" width="610.0" height="40.0" rx="0" fill="#e0f2f1" stroke="#94a3b8" stroke-width="1.2" /><text x="37.0" y="74.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" ></text><text x="165.0" y="74.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >Uygulama</text><text x="447.0" y="74.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >Süreçte yapılan işlem</text><rect x="14.0" y="90.0" width="610.0" height="56.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="122.5" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >K</text><text x="68.0" y="122.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Yoğurt üretimi</text><text x="278.0" y="114.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Süt bakterileri sütü mayalayıp</text><text x="278.0" y="130.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >yoğurda dönüştürür.</text><rect x="14.0" y="146.0" width="610.0" height="56.0" rx="0" fill="#f6fbfa" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="178.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >L</text><text x="68.0" y="178.6" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >İnsülin üretimi</text><text x="278.0" y="170.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >İnsan insülin geni bakterinin DNA'sına</text><text x="278.0" y="186.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >aktarılır; bakteri insülin üretir.</text><rect x="14.0" y="202.0" width="610.0" height="56.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="234.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >M</text><text x="68.0" y="234.6" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Zararlı böceğe dayanıklı mısır</text><text x="278.0" y="226.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Böcek zehiri üreten bir bakteri geni</text><text x="278.0" y="242.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >mısırın DNA'sına aktarılır.</text><rect x="14.0" y="258.0" width="610.0" height="56.0" rx="0" fill="#f6fbfa" stroke="#cbd5e1" stroke-width="1" /><text x="37.0" y="290.6" text-anchor="middle" font-size="13" font-weight="700" fill="#12263a" >N</text><text x="68.0" y="290.6" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Ekmek hamurunun kabarması</text><text x="278.0" y="282.5" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >Maya mantarı hamurdaki şekeri</text><text x="278.0" y="298.7" text-anchor="start" font-size="13" font-weight="400" fill="#12263a" >fermente ederek gaz oluşturur.</text><line x1="60.0" y1="50.0" x2="60.0" y2="314.0" stroke="#cbd5e1" stroke-width="1" /><line x1="270.0" y1="50.0" x2="270.0" y2="314.0" stroke="#cbd5e1" stroke-width="1" /></svg>