<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" fill="#12263a"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="1" y="1" width="638" height="273" rx="14" fill="#fbfefd" stroke="#bfe3de" stroke-width="2"/><rect x="8" y="12" width="200" height="250" rx="12" fill="#ffffff" stroke="#bfe3de" stroke-width="2"/><circle cx="34" cy="38" r="15" fill="#0d9488" stroke="none" stroke-width="2" /><text x="34" y="44" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">I</text><text x="22" y="74" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">Aynı genotipteki iki fide:</text><text x="22" y="91" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">güneşte 30 cm, gölgede 20</text><text x="22" y="108" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">cm boylanıyor.</text><g transform="translate(0,26)"><line x1="58" y1="150" x2="58" y2="215" stroke="#16a34a" stroke-width="6" /><circle cx="58" cy="138" r="16" fill="#4ade80" stroke="#12263a" stroke-width="2" /><line x1="118" y1="180" x2="118" y2="215" stroke="#16a34a" stroke-width="6" /><circle cx="118" cy="172" r="12" fill="#4ade80" stroke="#12263a" stroke-width="2" /><text x="58" y="232" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">30 cm</text><text x="118" y="232" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">20 cm</text><circle cx="178" cy="20" r="10" fill="#fde047" stroke="#f59e0b" stroke-width="2.5" /></g><rect x="216" y="12" width="200" height="250" rx="12" fill="#ffffff" stroke="#bfe3de" stroke-width="2"/><circle cx="242" cy="38" r="15" fill="#0d9488" stroke="none" stroke-width="2" /><text x="242" y="44" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">II</text><text x="230" y="74" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">Kırmızı gözlü meyve sineği</text><text x="230" y="91" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">ebeveynlerden beyaz gözlü</text><text x="230" y="108" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">bir yavru doğuyor.</text><g transform="translate(0,26)"><ellipse cx="276" cy="150" rx="30" ry="18" fill="#a16207" stroke="#12263a" stroke-width="2"/><circle cx="296" cy="144" r="8" fill="#ef4444" stroke="#12263a" stroke-width="2" /><ellipse cx="356" cy="150" rx="30" ry="18" fill="#a16207" stroke="#12263a" stroke-width="2"/><circle cx="376" cy="144" r="8" fill="#f8fafc" stroke="#12263a" stroke-width="2" /><text x="276" y="196" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">ebeveyn</text><text x="356" y="196" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">yavru</text></g><rect x="424" y="12" width="200" height="250" rx="12" fill="#ffffff" stroke="#bfe3de" stroke-width="2"/><circle cx="450" cy="38" r="15" fill="#0d9488" stroke="none" stroke-width="2" /><text x="450" y="44" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">III</text><text x="438" y="74" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">Ortanca (hortensia) çiçeği</text><text x="438" y="91" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">asidik toprakta mavi,</text><text x="438" y="108" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">bazik toprakta pembe</text><text x="438" y="125" text-anchor="start" font-size="13" fill="#12263a" font-weight="400">açıyor.</text><g transform="translate(0,26)"><circle cx="484" cy="150" r="26" fill="#60a5fa" stroke="#12263a" stroke-width="2" /><circle cx="564" cy="150" r="26" fill="#f9a8d4" stroke="#12263a" stroke-width="2" /><text x="484" y="206" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">asidik</text><text x="564" y="206" text-anchor="middle" font-size="13" fill="#12263a" font-weight="400">bazik</text></g></svg>