<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="2.0" y="2.0" width="896.0" height="436.0" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><rect x="40.0" y="70.0" width="820.0" height="46.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0" /><text x="54.0" y="101.3" font-size="20" fill="#fff" text-anchor="start" font-weight="700" >İddia</text><text x="494.0" y="101.3" font-size="20" fill="#fff" text-anchor="start" font-weight="700" >Gerekçe</text><rect x="40.0" y="116.0" width="820.0" height="62.0" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1" /><text x="54.0" y="141.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >I. Yalıtım yapılırsa yakıt</text><text x="54.0" y="166.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >tüketimi azalır.</text><text x="494.0" y="153.8" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >Isı kaybı azalır.</text><rect x="40.0" y="178.0" width="820.0" height="62.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="54.0" y="203.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >II. Bu yakıt ucuz olduğu için</text><text x="54.0" y="228.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >çevreye etkisi yoktur.</text><text x="494.0" y="203.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >Ucuz yakıtlar zarar</text><text x="494.0" y="228.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >vermez.</text><rect x="40.0" y="240.0" width="820.0" height="62.0" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1" /><text x="54.0" y="265.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >III. Soba bakımı yapılırsa</text><text x="54.0" y="290.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >verim artabilir.</text><text x="494.0" y="277.8" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >Yanma daha düzgün olur.</text><rect x="40.0" y="302.0" width="820.0" height="62.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="54.0" y="327.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >IV. Havalandırma yetersizse</text><text x="54.0" y="352.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >tehlike artabilir.</text><text x="494.0" y="327.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >Eksik yanma ürünleri</text><text x="494.0" y="352.3" font-size="20" fill="#0f172a" text-anchor="start" font-weight="400" >oluşabilir.</text></svg>