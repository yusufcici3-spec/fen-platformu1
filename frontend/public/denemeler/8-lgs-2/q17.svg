<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" fill="#12263a"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="1" y="1" width="638" height="328" rx="14" fill="#fbfefd" stroke="#bfe3de" stroke-width="2"/><text x="320" y="24" text-anchor="middle" font-size="16" fill="#12263a" font-weight="700">Üç farklı olay ve özellikleri</text><rect x="14" y="40" width="198" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="113" y="64" text-anchor="middle" font-size="16" fill="#12263a" font-weight="700">Olay X</text><text x="113" y="86" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">Kırmızı çiçekli bitkinin</text><text x="113" y="103" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">bir dalında beyaz çiçekler</text><text x="113" y="120" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">açtı; bu dalın tohumları</text><text x="113" y="137" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">beyaz çiçek verdi</text><rect x="224" y="40" width="198" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="323" y="64" text-anchor="middle" font-size="16" fill="#12263a" font-weight="700">Olay Y</text><text x="323" y="86" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">Düzenli yüzme yapan</text><text x="323" y="103" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">sporcunun kasları gelişti</text><rect x="434" y="40" width="198" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="533" y="64" text-anchor="middle" font-size="16" fill="#12263a" font-weight="700">Olay Z</text><text x="533" y="86" text-anchor="middle" font-size="12" fill="#334155" font-weight="400">Dağda